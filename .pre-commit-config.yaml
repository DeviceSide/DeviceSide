default_install_hook_types: [pre-commit, commit-msg]
# Python hooks build their envs on the runner's interpreter unless pinned; the local hooks need 3.14.
default_language_version:
  python: python3.14

repos:
  # -------------------------
  # General file hygiene
  # -------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml

  # -------------------------
  # Python linting (Ruff)
  # -------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
        types_or: [python, pyi]

  # -------------------------
  # Upgrade syntax automatically
  # -------------------------
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py314-plus"]

  # -------------------------
  # Catch common typos
  # -------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell

  # -------------------------
  # Secrets check
  # -------------------------
  - repo: https://github.com/betterleaks/betterleaks
    rev: 8d77e1712fb06fd14444cc648686f1d5655e28a8  # frozen: v1.10.0
    hooks:
      - id: betterleaks

  # -------------------------
  # GitHub workflows (correctness, then security)
  # -------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  # -------------------------
  # Shell scripts (actionlint only checks `run:` blocks)
  # -------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # -------------------------
  # Household details (terms from gitignored files; a no-op without them)
  # -------------------------
  - repo: local
    hooks:
      - id: check-private
        name: check private details
        entry: python scripts/check_private.py
        language: python
        stages: [pre-commit, commit-msg]

  # -------------------------
  # Log lines (docs/logging.md: no addresses, %r on caught exceptions)
  # -------------------------
  - repo: local
    hooks:
      - id: check-logging
        name: check log lines
        entry: python scripts/check_logging.py
        language: python
        files: ^custom_components/.*\.py$
