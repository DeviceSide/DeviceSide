default_install_hook_types: [pre-commit, commit-msg]
# Python hooks build their envs on the runner's interpreter unless pinned; the local hooks need 3.14.
default_language_version:
  python: python3.14

repos:
  # -------------------------
  # General file hygiene
  # -------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml

  # -------------------------
  # Python linting (Ruff)
  # -------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
        types_or: [python, pyi]

  # -------------------------
  # Upgrade syntax automatically
  # -------------------------
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: ["--py314-plus"]

  # -------------------------
  # Catch common typos
  # -------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # The standard lights table and its page list vendors' model strings from zigbee-herdsman-converters.
        exclude: ^(custom_components/deviceside/integrations/zigbee2mqtt/standard_lights\.py|docs/integrations/zigbee2mqtt/standard-lights\.md)$

  # -------------------------
  # Secrets check
  # -------------------------
  - repo: https://github.com/betterleaks/betterleaks
    rev: 39d5bdcf34db54e944facac5cf6e8b03db5e2b99  # frozen: v1.10.1
    hooks:
      - id: betterleaks

  # -------------------------
  # GitHub workflows (correctness, then security)
  # -------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        # Offline: a token in the env (cloud sandboxes set one) turns on online audits, which fail without API
        # access. workflow-lint.yml runs those.
        args: [--offline]

  # -------------------------
  # Shell scripts (actionlint only checks `run:` blocks)
  # -------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # -------------------------
  # Relative links and anchors (offline; external URLs are not checked)
  # -------------------------
  # Manual stage: contributors' commits never need lychee installed. lint.yml runs it on the binary it installs
  # (pinned to this rev); run it locally with `pre-commit run --all-files --hook-stage manual lychee-system`.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee-system
        args: [--offline, --include-fragments, --no-progress]
        stages: [manual]
        types: [file]
        types_or: [markdown, html]
        # Dated plans and audit reports are historical records; their dead links aren't worth fixing.
        exclude: ^docs/(plans|audits)/

  # -------------------------
  # Household details (terms from gitignored files; a no-op without them)
  # -------------------------
  - repo: https://github.com/jasonmx/pre-commit-hooks
    rev: 808c1457fd419bf24e7f8a7edda9834aa468519d  # frozen: v1.0.0
    hooks:
      - id: check-private

  # -------------------------
  # Log lines (docs/logging.md: no addresses, caught exceptions through describe)
  # -------------------------
  - repo: local
    hooks:
      - id: check-logging
        name: check log lines
        entry: python scripts/check_logging.py
        language: python
        files: ^custom_components/.*\.py$

  # -------------------------
  # HA names as literals (CLAUDE.md Conventions: Constants)
  # -------------------------
  - repo: local
    hooks:
      - id: check-ha-literals
        name: check HA literals
        entry: python scripts/check_ha_literals.py
        language: python
        files: ^custom_components/.*\.py$
