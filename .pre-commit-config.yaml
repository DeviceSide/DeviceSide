default_install_hook_types: [pre-commit, commit-msg]
# Python hooks build their envs on the runner's interpreter unless pinned; the local hooks need 3.14.
default_language_version:
  python: python3.14

repos:
  # -------------------------
  # General file hygiene
  # -------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml

  # -------------------------
  # Python linting (Ruff)
  # -------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
        types_or: [python, pyi]

  # -------------------------
  # Upgrade syntax automatically
  # -------------------------
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py314-plus"]

  # -------------------------
  # Catch common typos
  # -------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell

  # -------------------------
  # Secrets check
  # -------------------------
  - repo: https://github.com/betterleaks/betterleaks
    rev: 8d77e1712fb06fd14444cc648686f1d5655e28a8  # frozen: v1.10.0
    hooks:
      - id: betterleaks

  # -------------------------
  # Household details (terms from gitignored files; a no-op without them)
  # -------------------------
  - repo: local
    hooks:
      - id: check-private
        name: check private details
        entry: python scripts/check_private.py
        language: python
        stages: [pre-commit, commit-msg]
