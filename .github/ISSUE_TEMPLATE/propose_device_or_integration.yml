name: Propose a device or integration
description: Propose a new device or integration to be added to DeviceSide.
title: "Proposal: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals are accepted for a call sequence you've got working reliably on your own devices, and are willing to share. Speculative feature requests belong in the community forum.

        Building it yourself? Skip this form and open a pull request: see the [Fast track](https://github.com/DeviceSide/DeviceSide/blob/main/CONTRIBUTING.md#fast-track-build-it-yourself).
  - type: dropdown
    id: kind
    attributes:
      label: What are you proposing?
      options:
        - A new integration
        - More devices on an existing integration
        - A new action or entity domain
        - A call sequence I've got working reliably on my own devices
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Devices
      description: One line per device, as shown on its device page in Home Assistant, with a Zigbee device's manufacturer string (such as _TZ3000_…). Filled in when you start from DeviceSide's options. For a new integration, one device is enough.
      placeholder: integration · product name · model · manufacturer · firmware
    validations:
      required: true
  - type: checkboxes
    id: features
    attributes:
      label: Proposed features
      description: Check every feature that works in your home today and you'd like to see added to DeviceSide.
      options:
        - label: turn_on_for
        - label: turn_off_for
        - label: set_auto_off & clear_auto_off
        - label: set_auto_on & clear_auto_on
        - label: smooth dimming. I've tested fast raise-stop-raise & raise-stop-lower sequences
        - label: color saturation transitions. I've tested fast raise-stop-raise & raise-stop-lower sequences
        - label: color hue transitions. I've tested fast raise-stop-raise & raise-stop-lower sequences
        - label: set_attributes
        - label: set_scene
        - label: get_attributes
        - label: other (say which in the notes)
  - type: checkboxes
    id: qualify
    attributes:
      label: Checklist
      options:
        - label: I have searched the [existing issues](https://github.com/DeviceSide/DeviceSide/issues/) to see if my proposal already exists.
          required: true
        - label: I've got the feature(s) working in my home for the proposed device/integration.
          required: true
        - label: The feature runs natively on the device (e.g. turn-off delays use on-device timers).
          required: true
        - label: The feature works smoothly, with no unwanted jumps, flashes, lags or freezes.
          required: true
        - label: If my proposal gets implemented, I'm happy to test the DeviceSide release candidate on my device(s).
          required: true
  - type: textarea
    id: yaml
    attributes:
      label: Working YAML
      description: Paste the YAML action calls that you've got working in Home Assistant.
      render: yaml
    validations:
      required: true
  - type: dropdown
    id: involvement
    attributes:
      label: How involved do you want to be?
      options:
        - I want to build it and maintain it.
        - I want to build it.
        - I want to help code the change, with some guidance.
        - I want to test only.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else you'd like to add?
