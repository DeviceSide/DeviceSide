name: Propose a device or integration
description: Propose a new device or integration to be added to DeviceSide.
title: "Proposal: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals are accepted only for devices and integrations where a known YAML solution already exists. Please only submit a proposal if you have the feature running stably on your Home Assistant instance and are willing to share the YAML. Speculative feature requests belong in the community forum.

        Want to build it yourself? Wait until this issue is assigned to you, then reference it in your PR. PRs without one are closed automatically.
  - type: input
    id: integration
    attributes:
      label: Home Assistant integration
      description: e.g. zha, zigbee2mqtt, shelly.
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Device product name
  - type: input
    id: model
    attributes:
      label: Device model
      description: As shown on the device page in Home Assistant. If you're proposing a new integration, you only need to list one device in this field.
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
  - type: checkboxes
    id: features
    attributes:
      label: Proposed features
      description: Check every feature that works in your home today and you'd like to see added to DeviceSide.
      options:
        - label: turn_on_for
        - label: turn_off_for
        - label: set_auto_off & clear_auto_off
        - label: set_auto_on & clear_auto_on
        - label: smooth dimming. I've tested fast raise-stop-raise & raise-stop-lower sequences
        - label: color saturation transitions. I've tested fast raise-stop-raise & raise-stop-lower sequences
        - label: color hue transitions. I've tested fast raise-stop-raise & raise-stop-lower sequences
        - label: set_attributes
        - label: set_scene
        - label: get_attributes
        - label: other (say which in the notes)
  - type: checkboxes
    id: qualify
    attributes:
      label: Checklist
      options:
        - label: I have searched the [existing issues](https://github.com/jasonmx/DeviceSide/issues/) to see if my proposal already exists.
          required: true
        - label: I've got the feature(s) working in my home for the proposed device/integration.
          required: true
        - label: The feature runs natively on the device (e.g. turn-off delays use on-device timers).
          required: true
        - label: The feature works smoothly, with no unwanted jumps, flashes, lags or freezes.
          required: true
        - label: If my proposal gets implemented, I'm happy to test the DeviceSide release candidate on my device(s).
          required: true
  - type: textarea
    id: yaml
    attributes:
      label: Working YAML
      description: Paste the YAML action calls that you've got working in Home Assistant.
      render: yaml
    validations:
      required: true
  - type: dropdown
    id: involvement
    attributes:
      label: How involved do you want to be?
      options:
        - "Experienced coders only: I want to submit the PR myself."
        - I want to help code the change, with some guidance.
        - I want to test only.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else you'd like to add?
