name: Report a bug
description: Report a problem with DeviceSide.
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: integration
    attributes:
      label: Home Assistant integration
      description: e.g. zha, zigbee2mqtt, shelly.
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Device product name
  - type: input
    id: model
    attributes:
      label: Device model
      description: As shown on the device page in Home Assistant.
    validations:
      required: true
  - type: checkboxes
    id: qualify
    attributes:
      label: Checklist
      options:
        - label: I've checked that the feature and device are [listed as compatible](https://github.com/jasonmx/DeviceSide/blob/main/docs/device-compatibility.md), or I'm reporting a bug that's not device-specific.
          required: true
        - label: I have searched the [existing issues](https://github.com/jasonmx/DeviceSide/issues/) to see if an issue for this already exists.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Describe the bug
      description: Consider redacting private information before sharing YAML or logs (e.g. devices named after people, MAC addresses).
      placeholder: |
        1. What I expected to happen:
        1. What actually happened:
        1. Steps to reproduce:
        1. YAML and/or logs (if relevant):
  - type: input
    id: firmware
    attributes:
      label: Firmware version
  - type: input
    id: experimental_features
    attributes:
      label: Was Experimental features on?
      description: "on or off: DeviceSide's options, Configure > Settings. Filled in when you start from there."
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: deviceside_version
    attributes:
      label: DeviceSide version
    validations:
      required: true
