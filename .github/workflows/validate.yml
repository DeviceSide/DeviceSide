name: Validate

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# A new push to a pull request cancels its older run. Push, schedule and dispatch runs each get their own group:
# release gates read push runs, and a shared group would cancel a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa"  # main, 2026-06-08
        with:
          category: "integration"
