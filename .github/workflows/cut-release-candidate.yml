name: Cut release candidate

# The only way a vX.Y.ZrcN tag is made (a tag ruleset refuses any other): from main, or from release/vX.Y.Z when a
# soaking RC or a release needs a fix without what main has gained since (cut that branch from its tag). Requires a
# version above the latest release, manifest.json at X.Y.Z, green CI on the head, and docs/audits/<rc>.md covering
# every commit since the previous RC. An RC needs no sign-off (docs/evidence.md, Release gate): its notes ask for testers
# of each integration changed since the last release without one, and of each Untested fix (check_release --notes).
# Tags pushed with GITHUB_TOKEN start no other workflow, so anything an RC needs runs here.
#
# Two jobs, so the code `uv sync` installs never shares a runner with write access: `check` runs the gates with a
# read-only token, and `tag`, on a fresh runner that installs nothing, alone holds the write token and the deploy key.

on:
  workflow_dispatch:
    inputs:
      rc:
        description: "Tag to cut, vX.Y.ZrcN"
        required: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RC: ${{ inputs.rc }}
      BRANCH: ${{ github.ref_name }}
    outputs:
      notes: ${{ steps.gates.outputs.notes }}

    steps:
      - name: Refuse a tag ref
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Dispatch from main or release/vX.Y.Z, not a tag."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against the branch
        run: python3 scripts/check_tag.py "$RC" "$BRANCH"

      - name: Refuse a release
        run: |
          if [[ ! "$RC" =~ ^v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            echo "::error::$RC is not vX.Y.ZrcN; releases come from cut-release."
            exit 1
          fi

      - name: Require green CI on the head
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/require_green.sh "$GITHUB_SHA"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Check the audit record
        run: uv run --no-project --with pyyaml==6.0.3 python scripts/check_audit.py "$RC" "$GITHUB_SHA"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      # A record cites the commit its rig run deployed, often on a PR branch since squash-merged and deleted.
      - name: Fetch the commits test records cite
        run: git fetch --quiet origin '+refs/pull/*/head:refs/remotes/pull/*'

      # The call for testers rides to `tag` as an output, as that job's runner has none of this one's files.
      - name: Write the call for testers
        id: gates
        run: |
          .venv/bin/python scripts/check_release.py --notes "$RUNNER_TEMP/notes.md"
          { echo 'notes<<END_OF_NOTES'; cat "$RUNNER_TEMP/notes.md"; echo 'END_OF_NOTES'; } >> "$GITHUB_OUTPUT"

  tag:
    needs: check
    runs-on: ubuntu-latest
    # Holds the tag deploy key, and deploys only from main and release/*.
    environment: release
    permissions:
      contents: write
    env:
      RC: ${{ inputs.rc }}
      GH_TOKEN: ${{ github.token }}

    steps:
      # The checked commit only; no credentials left in .git, as only the push holds the key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The tag ruleset's only bypass is the deploy key: GITHUB_TOKEN can't bypass a ruleset on a personal repo.
      # The key exists only in this step, in a file only the runner user can read, and github.com's host keys come
      # from the API over TLS rather than trust on first use.
      - name: Tag and publish a pre-release
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
          key="$RUNNER_TEMP/tag_deploy_key"
          hosts="$RUNNER_TEMP/github_known_hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$key")
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts"
          git tag "$RC" "$GITHUB_SHA"
          git push "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/$RC"
          gh release create "$RC" --verify-tag --prerelease --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --title "$RC"
