name: Cut release

# The only way a vX.Y.Z tag is made (a tag ruleset refuses any other). Dispatched from main, it tags the commit of
# vX.Y.Z's latest RC, not main's head: what ships is what soaked, while main moves on. Requires a version above the
# latest release and, at the RC's commit, manifest.json at that version, green CI, no experimental adapter, and every
# adapter's test records passing and citing a commit with its adapter code (check_release --release --records). Soak is the repo
# owner's call.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to cut, vX.Y.Z"
        required: true

permissions: {}

jobs:
  cut:
    runs-on: ubuntu-latest
    # Holds the tag deploy key, and deploys only from main and release/*.
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Refuse a tag ref
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Dispatch from main, not a tag."
          exit 1

      # No credentials left in .git: the repo is public, so fetches need none, and only the push step holds the key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag, and find the RC it releases
        run: |
          target=$(python3 scripts/check_tag.py "$VERSION" "$BRANCH")
          echo "TARGET=$target" >> "$GITHUB_ENV"

      - name: Refuse a release candidate
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$VERSION is not vX.Y.Z; RCs come from cut-release-candidate."
            exit 1
          fi

      - name: Require green CI on the RC
        run: bash scripts/require_green.sh "$TARGET"

      # The remaining gates check the tree that ships, with the scripts it shipped with.
      - name: Check out the RC
        run: git checkout --quiet --detach "$TARGET"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      # A record cites the commit its rig run deployed, often on a PR branch since squash-merged and deleted.
      - name: Fetch the commits test records cite
        run: git fetch --quiet origin '+refs/pull/*/head:refs/remotes/pull/*'

      - name: Refuse an experimental adapter, or a test record older than its adapter's code
        run: .venv/bin/python scripts/check_release.py --release --records

      # The tag ruleset's only bypass is the deploy key: GITHUB_TOKEN can't bypass a ruleset on a personal repo.
      # The key exists only in this step, in a file only the runner user can read, and github.com's host keys come
      # from the API over TLS rather than trust on first use.
      - name: Tag and publish the release
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/tag_deploy_key"
          hosts="$RUNNER_TEMP/github_known_hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$key")
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts"
          git tag "$VERSION" "$TARGET"
          git push "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --latest --generate-notes --title "$VERSION"
