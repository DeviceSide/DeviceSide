name: Cut release

# The only way a vX.Y.Z tag is made (a tag ruleset refuses any other): from main, above the latest release, with
# manifest.json at that version, green CI on the head, no experimental adapter, and every adapter's test records
# citing a commit with the head's adapter code (check_release --release --records). Soak is the repo owner's call.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to cut, vX.Y.Z"
        required: true

permissions: {}

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Refuse a tag ref
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Dispatch from main, not a tag."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The v* tag ruleset's only bypass: GITHUB_TOKEN can't bypass a ruleset on a personal repo.
          ssh-key: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}

      - name: Check the tag against the branch
        run: python3 scripts/check_tag.py "$VERSION" "$BRANCH"

      - name: Refuse a release candidate
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$VERSION is not vX.Y.Z; RCs come from cut-release-candidate."
            exit 1
          fi

      - name: Require green CI on the head
        run: bash scripts/require_green.sh "$GITHUB_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      # A record cites the commit its rig run deployed, often on a PR branch since squash-merged and deleted.
      - name: Fetch the commits test records cite
        run: git fetch --quiet origin '+refs/pull/*/head:refs/remotes/pull/*'

      - name: Refuse an experimental adapter, or a test record older than its adapter's code
        run: .venv/bin/python scripts/check_release.py --release --records

      - name: Tag and publish the release
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --latest --generate-notes --title "$VERSION"
