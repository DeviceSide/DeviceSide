name: Maintainer merge

# An integration or family maintainer's `/merge <sha>` comment merges a pull request whose every file they own
# (scripts/check_maintainer_merge.py says who owns what, and what it refuses). The SHA is the head they reviewed: the
# merge turns on auto-merge pinned to it, so a push after the comment cancels it. The merge goes through the ruleset like
# any other: GitHub squash-merges once the required checks pass (at once if they already have), and the ruleset has no
# up-to-date rule, so a branch behind main needs no update. It merges as the maintainer-merge GitHub App, not
# GITHUB_TOKEN: a push from GITHUB_TOKEN starts no workflows, and tests.yml and lint.yml run on push to main.
# issue_comment runs the default branch's workflow and script, so a PR can't edit its own check. No step runs the
# PR's code: its head is fetched and read with `git show`, as data. The App's key is in the maintainer-merge
# environment, which only the merge job (after the check passes) and the guard read. The App and environment
# settings, and how to switch this off: docs/repo-maintainers.md.
#
# GitHub checks the pinned SHA only when auto-merge is turned on, and turns it off on a push only from a fork: a push
# by someone with write access leaves it on, and the unreviewed head would merge. So `guard`, on pull_request_target
# synchronize, turns off auto-merge the App turned on (anyone else's is left alone) and says so. It runs base-branch
# code with the App's token and no checkout. The race left: a new head whose required checks all pass in the few
# seconds before the guard runs merges. A conflicting PR is refused before auto-merge is armed, and `/merge` says so.

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] runs only base-branch code; the PR head is read as data
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers] runs only base-branch code, no checkout; the PR is never run
    types: [synchronize]

permissions: {}

jobs:
  check:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/merge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      head: ${{ steps.pr.outputs.head }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # The head checked is the one merged: auto-merge is pinned to its SHA, so a push after this cancels the merge.
      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
        run: |
          read -r draft base head < <(gh pr view "$NUMBER" --json isDraft,baseRefName,headRefOid \
            --jq '"\(.isDraft) \(.baseRefName) \(.headRefOid)"')
          if [ "$draft" != false ] || [ "$base" != main ]; then
            echo "reason=Only a pull request against main, marked ready for review, merges this way." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          want=${BODY#/merge }
          if ! [[ "$want" =~ ^[0-9a-f]{7,40}$ && "$head" == "$want"* ]]; then
            echo "reason=Comment \`/merge <sha>\` with the head you reviewed; it is now ${head:0:7}." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Check it is the commenter's to merge
        id: check
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          git fetch --quiet --no-tags origin "$HEAD_SHA"
          python scripts/check_maintainer_merge.py HEAD "$HEAD_SHA" --commenter "$COMMENTER"

      - name: Say why not
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          REASON: ${{ steps.pr.outputs.reason || steps.check.outputs.reason || 'The check failed; see the workflow run.' }}
        run: |
          gh pr comment "$NUMBER" --body "❌ \`/merge\`: $REASON"

  merge:
    needs: check
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: maintainer-merge
    permissions:
      pull-requests: write

    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ vars.MAINTAINER_MERGE_APP_ID }}
          private-key: ${{ secrets.MAINTAINER_MERGE_APP_KEY }}
          # Turning on auto-merge needs pull requests write; the squash merge itself needs contents write.
          permission-contents: write
          permission-pull-requests: write

      # `gh pr merge --auto` merges at once when the pull request is already mergeable, and otherwise turns on
      # auto-merge, which squash-merges when the required checks pass. --match-head-commit pins it to the reviewed head.
      - name: Turn on auto-merge
        id: merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.check.outputs.head }}
        run: |
          # A conflicting PR would arm auto-merge and wait forever: refuse it. mergeable is UNKNOWN while GitHub computes it.
          for _ in 1 2 3 4 5 6; do
            mergeable=$(gh pr view "$NUMBER" --json mergeable --jq .mergeable)
            [ "$mergeable" != UNKNOWN ] && break
            sleep 5
          done
          if [ "$mergeable" = CONFLICTING ]; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "It conflicts with main."
            exit 1
          fi
          if ! out=$(gh pr merge "$NUMBER" --auto --squash --match-head-commit "$HEAD_SHA" 2>&1); then
            echo "$out"
            delim=$(openssl rand -hex 16)
            printf 'error<<%s\n%s\n%s\n' "$delim" "$out" "$delim" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # One comment, true in each case: merged now, armed with checks pending, or armed with a required check failed.
      # Read with the App's token, which can see checks; github.token here has pull requests write only.
      - name: Say what happens
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          # The base's required checks, read from its rules: an optional check failing is no reason to warn. A rules
          # read that fails leaves failed at 0, and the neutral text.
          failed=0
          if required=$(gh api "repos/$GH_REPO/rules/branches/main" --jq \
            '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context]'); then
            failed=$(gh pr view "$NUMBER" --json statusCheckRollup | jq --argjson req "$required" \
              '[.statusCheckRollup[]? | select((.name // .context) as $n | $req | index($n))
                | select((.conclusion // .state) | IN("FAILURE", "ERROR", "TIMED_OUT", "STARTUP_FAILURE"))] | length') || failed=0
          fi
          state=$(gh pr view "$NUMBER" --json state --jq .state)
          if [ "$state" = MERGED ]; then
            msg="✅ \`/merge\`: merged."
          elif [ "$failed" -gt 0 ]; then
            msg="⚠️ \`/merge\`: auto-merge is on, but a required check failed; it merges once the author pushes a fix and the checks pass. Comment \`/merge <sha>\` again with the new head if the push cancels it."
          else
            msg="✅ \`/merge\`: squash-merges once its required checks pass. A push to the branch cancels this."
          fi
          gh pr comment "$NUMBER" --body "$msg"

      # The likely causes first, each with what to do; never "update the branch", which a Triage maintainer can't.
      - name: Say why not
        if: failure() && steps.merge.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.check.outputs.head }}
          ERROR: ${{ steps.merge.outputs.error }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          read -r state head < <(gh pr view "$NUMBER" --json mergeStateStatus,headRefOid \
            --jq '"\(.mergeStateStatus) \(.headRefOid)"')
          if [ "$CONFLICT" = true ] || [ "$state" = DIRTY ]; then
            why="it conflicts with main. Its author merges main into the branch; then comment \`/merge <sha>\` with the new head."
          elif [ "$head" != "$HEAD_SHA" ]; then
            why="the head moved to ${head:0:7} after your comment. Review it and comment \`/merge ${head:0:7}\`."
          else
            why="GitHub refused to merge it${ERROR:+: $ERROR}. Details: $RUN"
          fi
          gh pr comment "$NUMBER" --body "❌ \`/merge\`: $why"

  # A push after `/merge` must not merge the new head unreviewed. Event values reach the shell only through env.
  guard:
    # `/merge` serves only `main`, and the environment's key is limited to it.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: maintainer-merge
    permissions: {} # every call uses the App token
    # Its own group per PR: never the `/merge` runs', which it must not cancel or wait behind.
    concurrency:
      group: maintainer-merge-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ vars.MAINTAINER_MERGE_APP_ID }}
          private-key: ${{ secrets.MAINTAINER_MERGE_APP_KEY }}
          # Turning auto-merge off needs contents write as well: with pull requests write alone, GitHub refuses
          # `disablePullRequestAutoMerge` ("Resource not accessible by integration").
          permission-contents: write
          permission-pull-requests: write

      # gh reads the enabler as `app/<slug>` or `<slug>`, with `[bot]` on some paths: compare the bare slug.
      - name: Turn off the App's auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          by=$(gh pr view "$NUMBER" --json autoMergeRequest --jq '.autoMergeRequest.enabledBy.login // empty')
          by=${by#app/}
          by=${by%\[bot\]}
          if [ -z "$by" ] || [ "$by" != "$APP_SLUG" ]; then
            exit 0
          fi
          gh pr merge "$NUMBER" --disable-auto
          gh pr comment "$NUMBER" --body "⚠️ \`/merge\` cancelled: a push after it turned auto-merge off. Review the new head and comment \`/merge ${HEAD_SHA:0:7}\`."
