name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "wt/**"

jobs:
  # A change touching only *.md files and docs/ skips pytest. The skip happens in the job, not the trigger: the
  # ruleset requires the "pytest" check, which a skipped job satisfies and a workflow that never ran leaves pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Look for changes outside docs
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch's push has an all-zero base, and a force push's may be gone: test those.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=true
          else
            files=$(git diff --name-only --no-renames "$BASE...$HEAD")
            echo "$files"
            if [ -n "$files" ] && grep -qvE '(\.md$|^docs/)' <<<"$files"; then code=true; else code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  pytest:
    needs: changes
    # Fails open: tests run unless the changes job succeeded and found docs only.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --locked

      - name: Run tests
        run: .venv/bin/pytest -q tests/ --cov=custom_components/device_side --cov-report=json

      - name: Check coverage
        run: .venv/bin/python scripts/check_release.py --coverage coverage.json
