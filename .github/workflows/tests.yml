name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

# A new push to a pull request cancels its older run. Push, schedule and dispatch runs each get their own group:
# release gates read push runs, and a shared group would cancel a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request touching only *.md files and docs/ (other than what the generators read) skips pytest. A push never
  # does: release gates read a push's runs, and a skipped job concludes success. The skip happens in the job, not the
  # trigger: the ruleset requires the "pytest" check, which a skipped job satisfies and a workflow that never ran
  # leaves pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for changes outside docs
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            code=true
          # A base that is gone (a force push) is tested.
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=true
          else
            files=$(git diff --name-only --no-renames "$BASE...$HEAD")
            echo "$files"
            # The bundles' records, devices.yaml, index and internals pages, icons, models.yaml, the shared pages and the
            # README are docs, but generated, generated from or cited by code: check them.
            if [ -n "$files" ] && grep -qvE '(\.md$|^docs/)' <<<"$files"; then code=true
            elif grep -qE '^docs/integrations/[^/]+/(test-records/|devices\.yaml$|index\.md$|internals\.md$)' <<<"$files"; then code=true
            elif grep -qE '^(docs/(icons/|device-compatibility\.md$|integrations\.md$|internals\.md$|models\.yaml$)|README\.md$)' <<<"$files"; then code=true
            else code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  pytest:
    needs: changes
    # Fails open: tests run unless the changes job succeeded and found docs only.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    outputs:
      deprecations: ${{ steps.deprecations.outputs.reports }}

    steps:
      # A shallow checkout: no test or check here reads the repo's history (the git tests build their own repos).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning] publishes no artifacts, releases come from cut-release*

      - name: Install test dependencies
        run: uv sync --locked

      - name: Run tests
        env:
          DEVICESIDE_HA_DEPRECATIONS: ${{ runner.temp }}/ha-deprecations.json
        run: .venv/bin/pytest -n auto tests/ --cov=custom_components/deviceside --cov-report=json

      # HA's deprecation reports on DeviceSide's code (tests/ha_deprecations.py), for the ha-deprecations job. They
      # fail nothing: HA names the version that breaks the call, often a year out.
      - name: Read the HA deprecation reports
        id: deprecations
        if: ${{ !cancelled() }}
        run: echo "reports=$(jq -c . "$RUNNER_TEMP/ha-deprecations.json" 2>/dev/null || echo '[]')" >> "$GITHUB_OUTPUT"

      - name: Check coverage
        run: .venv/bin/python scripts/check_release.py --coverage coverage.json

      - name: Check the device cards and compatibility page are current
        run: .venv/bin/python scripts/gen_compat.py --check

      - name: Check the README feature table is current
        run: .venv/bin/python scripts/gen_features.py --check

      - name: Check CODEOWNERS is current
        run: .venv/bin/python scripts/gen_codeowners.py --check

  # One open issue per deprecated call HA reports, filed from main only: main's HA pin is the one the next release is
  # tested on, and a fork's pull request gets no token that can file one. Its own job, so the token that can write
  # issues never runs test code.
  ha-deprecations:
    needs: pytest
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.pytest.outputs.deprecations != '' && needs.pytest.outputs.deprecations != '[]' }}
    runs-on: ubuntu-latest
    # Reports fail nothing, and nor does filing them: release gates read main's runs.
    continue-on-error: true
    permissions:
      issues: write

    steps:
      - name: File an issue for each new deprecated call
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORTS: ${{ needs.pytest.outputs.deprecations }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Matched on the exact title among open issues; the search only narrows the list.
          open=$(gh issue list --state open --limit 200 --search '"HA deprecation" in:title' --json title --jq '.[].title')
          jq -c '.[]' <<<"$REPORTS" | while read -r report; do
            title="HA deprecation: $(jq -r .call <<<"$report")"
            if grep -qxF "$title" <<<"$open"; then
              echo "Already open: $title"
              continue
            fi
            fence='```'
            body=$(printf "HA reports a deprecated call in DeviceSide's code. It works until the HA version the report names.\n\n%s\n%s\n%s\n\nFrom the [Tests run](%s) at %s.\n" \
              "$fence" "$(jq -r .message <<<"$report")" "$fence" "$RUN_URL" "$GITHUB_SHA")
            gh issue create --title "$title" --body "$body"
          done
