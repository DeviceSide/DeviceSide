name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "wt/**"

permissions:
  contents: read

jobs:
  # A pull request touching only *.md files and docs/ (other than what the generators read) skips pytest. A push never
  # does: release gates read a push's runs, and a skipped job concludes success. The skip happens in the job, not the
  # trigger: the ruleset requires the "pytest" check, which a skipped job satisfies and a workflow that never ran
  # leaves pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for changes outside docs
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            code=true
          # A base that is gone (a force push) is tested.
          elif ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=true
          else
            files=$(git diff --name-only --no-renames "$BASE...$HEAD")
            echo "$files"
            # Records, icons, devices.yaml, the device compatibility and integrations pages and the README are docs, but
            # generated or generated from: check them.
            if [ -n "$files" ] && grep -qvE '(\.md$|^docs/)' <<<"$files"; then code=true
            elif grep -qE '^(docs/(test-records/|icons/|device-compatibility\.md$|integrations\.md$|devices\.yaml$)|README\.md$)' <<<"$files"; then code=true
            else code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  pytest:
    needs: changes
    # Fails open: tests run unless the changes job succeeded and found docs only.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest

    steps:
      # Full history: the compatibility page is Verified only on records as new as their code, so its check (and the
      # test pinning the checked-in page) diffs each record's cited commit against HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A record cites the commit its rig run deployed, often on a PR branch since squash-merged and deleted. Not under
      # refs/remotes/pull/: on a pull_request run, checkout already holds refs/remotes/pull/<n>/merge there.
      - name: Fetch the commits test records cite
        run: git fetch --quiet origin '+refs/pull/*/head:refs/remotes/pr/*'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning] publishes no artifacts, releases come from cut-release*

      - name: Install test dependencies
        run: uv sync --locked

      - name: Run tests
        run: .venv/bin/pytest tests/ --cov=custom_components/deviceside --cov-report=json

      - name: Check coverage
        run: .venv/bin/python scripts/check_release.py --coverage coverage.json

      - name: Check the device cards and compatibility page are current
        run: .venv/bin/python scripts/gen_compat.py --check

      - name: Check the README feature table is current
        run: .venv/bin/python scripts/gen_features.py --check
