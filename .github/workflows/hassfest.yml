name: Validate with hassfest

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

permissions:
  contents: read

# A new push to a pull request cancels its older run. Push, schedule and dispatch runs each get their own group:
# release gates read push runs, and a shared group would cancel a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
          with:
            persist-credentials: false
        - uses: "home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361"  # master, 2026-10-26
