# Zigbee2MQTT's data for scripts/gen_compat.py (the README card and the evidence on docs/device-compatibility.md) and
# scripts/gen_features.py (the README column). gen_compat's docstring gives the format.

column: Z2M
column_order: 1
capabilities:
  # The classes integrations/zigbee2mqtt/families/ name, each a card line (or, when its domains show different
  # features, one per domain, by `domains`), so each phrase says what sets the class apart from its neighbors.
  hue:
    phrase: Hue devices
    section: Hue
    domains: {light: Hue lights, switch: Hue smart plugs}
  ikea:
    phrase: IKEA devices
    section: IKEA
    domains: {light: IKEA lights, switch: IKEA outlets}
  ikea_timer_harmed: {phrase: "IKEA LED2005R5 and LED2106R3 (TRÅDFRI GU10 white spectrum)", section: IKEA}
  tuya_zcl:
    phrase: other Tuya devices
    section: Tuya
    domains: {light: other Tuya lights, switch: other Tuya plugs and switches}
  # Tuya's inching (families/tuya/inching.py): the two single-endpoint switches research measured it on.
  tuya_inching:
    phrase: Tuya WHD02 (_TZ3000_skueekg3, model TS0001) and Mowe MW781Z (_TZ300A_rncj86af)
    section: Tuya
  # The TS011F's classes are its variants (`sections` below), each named by what its Zigbee2MQTT page shows.
  tuya_ts011f: {phrase: no countdown setting, section: Tuya TS011F plugs}
  tuya_countdown: {phrase: other makers with a countdown setting, section: Tuya TS011F plugs}
  tuya_countdown_tz3000_0zfrhq4i: {phrase: _TZ3000_0zfrhq4i, section: Tuya TS011F plugs}
  tuya_countdown_tz3000_typdpbpg: {phrase: _TZ3000_typdpbpg, section: Tuya TS011F plugs}
  tuya_countdown_tz3000_gznh2xla: {phrase: _TZ3000_gznh2xla, section: Tuya TS011F plugs}
  tuya_countdown_tz3000_okaz9tjs: {phrase: _TZ3000_okaz9tjs, section: Tuya TS011F plugs}
  tuya_countdown_harmed: {phrase: _TZ3000_gjnozsaz, section: Tuya TS011F plugs}
  # Tuya's datapoint countdown, a class per limit (families/tuya/datapoint.py): one page section, which the card names
  # by its phrase (`sections` below) where a line holds all three; each phrase names its limit, as the Not supported
  # table shows each class on its own.
  tuya_datapoint:
    phrase: Tuya datapoint devices with one 12-hour countdown
    section: Tuya datapoint devices with one countdown
  tuya_datapoint_24h:
    phrase: Tuya datapoint devices with one 24-hour countdown
    section: Tuya datapoint devices with one countdown
  tuya_datapoint_2h: {phrase: AVATTO ZBS16 (a Tuya datapoint relay), section: Tuya datapoint devices with one countdown}
  tuya_mcu:
    phrase: other Tuya datapoint devices
    section: Tuya
    domains: {light: other Tuya datapoint lights, switch: other Tuya datapoint switches}
  # Sonoff's inching (families/sonoff): the single-channel relays and dimmer, and the two plugs it is not built for.
  sonoff_inching:
    phrase: Sonoff single-channel relays and dimmer (ZBMINIR2 and its white label MINI-ZBD, ZBMicro, MINI-ZB1GS, MINI-ZB1GSP, BASIC-ZB1GSP, S61SZBTPB, MINI-ZBDIM)
    section: Sonoff
    domains: {light: Sonoff MINI-ZBDIM, switch: Sonoff single-channel relays}
  sonoff_s60: {phrase: Sonoff S60ZBTPF and S60ZBTPG, section: Sonoff}
  sengled: {phrase: Sengled bulbs, section: Sengled}
  gledopto: {phrase: Gledopto lights, section: Gledopto}
  other:
    phrase: other brands
    section: Other brands
    domains: {light: other brands' lights, switch: other brands' plugs and switches}
# A phrase for a page section; with `variants`, the card gives its classes a parent bullet, saying what to check.
sections:
  Tuya datapoint devices with one countdown:
    phrase: Tuya datapoint devices with one countdown
  Tuya TS011F plugs:
    phrase: Tuya TS011F plugs
    variants: check Manufacturer and the countdown setting on the plug's Zigbee2MQTT page
