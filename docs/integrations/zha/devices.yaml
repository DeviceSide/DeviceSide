# ZHA's data for scripts/gen_compat.py (the README card and the evidence on docs/device-compatibility.md) and
# scripts/gen_features.py (the README column). gen_compat's docstring gives the format.

column: ZHA
column_order: 2
capabilities:
  # The classes integrations/zha/families/ name, each a card line (or, when its domains show different features,
  # one per domain, by `domains`), so each phrase says what sets the class apart from its neighbors.
  hue:
    phrase: Hue devices
    section: Hue
    domains: {light: Hue lights, switch: Hue smart plugs}
  ikea:
    phrase: IKEA devices
    section: IKEA
    domains: {light: IKEA lights, switch: IKEA outlets}
  ikea_timer_harmed: {phrase: "IKEA LED2005R5 and LED2106R3 (TRÅDFRI GU10 white spectrum)", section: IKEA}
  tuya_countdown: {phrase: "Tuya countdown plugs and switches (TS011F, TS0001–TS0004, TS0011, TS0726)", section: Tuya}
  tuya_countdown_harmed: {phrase: "Tuya TS011F plugs (_TZ3000_gjnozsaz)", section: Tuya}
  tuya_zcl:
    phrase: other Tuya devices
    section: Tuya
    domains: {light: other Tuya lights, switch: other Tuya plugs and switches}
  tuya_mcu:
    phrase: Tuya datapoint devices
    section: Tuya
    domains: {light: Tuya datapoint lights, switch: Tuya datapoint switches}
  sengled: {phrase: Sengled bulbs, section: Sengled}
  sonoff_swv: {phrase: Sonoff SWV, section: Sonoff SWV}
  other:
    phrase: other brands
    section: Other brands
    domains: {light: other brands' lights, switch: other brands' plugs and switches}
# A phrase for a page section, which a card line holding every class the section shows in its domains uses instead.
sections:
  Tuya:
    phrase: Tuya devices
    domains: {light: Tuya lights, switch: Tuya plugs and switches}
