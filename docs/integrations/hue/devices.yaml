# Hue's data for scripts/gen_compat.py (the README card and the evidence on docs/device-compatibility.md) and
# scripts/gen_features.py (the README column). gen_compat's docstring gives the format.

column: Hue Bridge
column_order: 4
requires: Bridge v2/Pro
capabilities:
  # The classes integrations/hue/classes.py names, but smart_scene: a no known method entry in code (NoKnownMethod),
  # named by its own `what`.
  hue:
    phrase: Hue devices
    section: Device classes
    domains: {light: Hue lights, scene: scenes of Hue lights}
  other:
    phrase: other brands
    section: Other brands
    domains: {light: other brands' lights, scene: scenes with other brands' lights}
