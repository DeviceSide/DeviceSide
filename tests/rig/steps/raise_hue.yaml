# Hue on Zigbee2MQTT and ZHA: a cycle the bulb runs until a stop, so each test ends with one. Zigbee2MQTT publishes a
# hue stop's color as hs, which HA takes only with z2m_color_modes on (the default). ZHA reads x/y in any color mode,
# so its refresh after the stop should match a live read.
action: raise_hue
rig_seconds: 85
tests:
  # Hue is a cycle with no prediction, so this catches the bookkeeping a stop leaves: a second cycle refused, or one
  # that restarts from the setup's hue instead of turning on from the halt.
  - name: hue_stop_raise
    roles: [light_color, group_color]
    only: [zigbee2mqtt, zha]
    setup:
      - set: {state: on, brightness_pct: 70, hs_color: [30, 90]}
      - wait: 1  # the bulb fades into the color (0.4 s on Z2M); a move started mid-fade starts short of the mark
    steps:
      - mark_hue: {}
      - call: {sweep_time: 20}  # 18° a second: 54° up the wheel after 3 s
      - expect_response: {status: expected, integration: self}
      - wait: 3
      - call: {action: stop}
      - expect_response: {status: expected, integration: self}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - expect_hue_travel: {by: 54, tolerance: 12}
      - wait: 3  # a stop that leaves a second change behind shows here
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01}
      - expect_hue_travel: {by: 54, tolerance: 12}
      - mark_hue: {}
      - call: {sweep_time: 20}
      - expect_response: {status: expected, integration: self}
      - wait: 3
      - call: {action: stop}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - expect_hue_travel: {by: 54, tolerance: 12}
    observe:
      roles: [light_color]  # the group_color case is automated only
      see: 'The light at hue 30° (orange), 90 % saturation, turning through yellow at 18° a second, stopped after 3 s near 84°; then turning on from there, stopped again after 3 s near 138°.'
      watch: 'Each stop and the 1 s after it: no jump, and no second change a second later; the second turn starts where the first stopped.'
      ask: Did it stop where it was and hold, with no jump at either stop or a second later, and turn on from where it halted?
