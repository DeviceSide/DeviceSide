# hue_dimmer tests/RELEASE_CHECKLIST.md §2.5 and §2.6 from the stop side; raise_brightness.yaml and
# lower_brightness.yaml check the move that follows. Samples after a raise or lower read device_side (Hue's
# prediction, Zigbee2MQTT's and ZHA's live reads), in percent: HA shows a fade's end value at once.
action: stop
rig_seconds: 420
tests:
  - name: halts_a_raise  # §2.5; the hold is sampled in raise_brightness.yaml's raise_stop_raise
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 10}
      - wait: 1.5  # the set's own fade is still running when the raise starts, and the raise reads its start
    steps:
      - call: {action: raise_brightness, sweep_time: 10}
      - wait: 3
      - call: {}
      - expect_response: {status: expected, integration: self}
      - sample: {attribute: brightness, for: 4, expect: steady, max: 78, source: device_side}

  - name: halts_a_lower_to_off  # Hue refuses a dimming stop during a soft off, so it is cut with on + brightness
    roles: [light_ct, group]
    setup:
      - set: {state: on, brightness_pct: 100}
      - wait: 1.5
    steps:
      - call: {action: lower_brightness, sweep_time: 10}
      - wait: 3
      - call: {}
      - expect_response: {status: expected, integration: self}
      - expect_state: {state: on, within: tol}
      - sample: {attribute: brightness, for: 4, expect: steady, min: 47, max: 82, source: device_side}
    observe:
      roles: [light_ct]  # Hue's was watched in #48, and a group gets the same command
      only: [zigbee2mqtt]
      see: The light at full, fading slowly toward off, stopped after 3 s.
      watch: 'The stop: it holds about two thirds up, with no flash, jump or blink off first.'
      ask: Did it stop part way down and hold there, with no flash, jump or blink off?

  - name: stop_when_idle  # §2.6
    roles: [light_ct, group]
    steps:
      - set: {state: on, brightness_pct: 50}
      # ZHA holds a light's reports for 0.5 s after a turn_on, then applies the last: the bulb's report of the
      # previous case's restore can land there, and HA shows that level until the next report.
      - wait: 2
      - call: {}
      - expect_response: {status: expected}
      - sample: {attribute: brightness, for: 2, expect: steady}

  # Zigbee2MQTT publishes a hue stop's color as hs, which HA takes only with z2m_color_modes on (the default). ZHA
  # reads x/y in any color mode, so its refresh after the stop should match a live read.
  - name: hue_cycle_stop
    roles: [light_color, group_color]
    only: [zigbee2mqtt, zha]
    setup:
      - set: {state: on, brightness_pct: 70, hs_color: [30, 90]}
    steps:
      - call: {action: raise_hue, sweep_time: 20}  # 18° a second: about 84° after 3 s
      - wait: 3
      - call: {}
      - expect_response: {status: expected, integration: self}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - wait: 3
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01}
    observe:
      roles: [light_color]  # the group_color case is automated only
      see: 'The light at hue 30° (orange), 90 % saturation, turning through yellow at 18° a second, stopped after 3 s near 84°.'
      watch: 'The stop and the 1 s after it: no jump, and and no second change a second later.'
      ask: Did it stop where it was and hold, with no jump at the stop or a second later?

  - name: saturation_down_stop
    roles: [light_color, group_color]
    setup:
      - set: {state: on, brightness_pct: 70, hs_color: [200, 90]}
    steps:
      - call: {action: lower_saturation, sweep_time: 10}  # 9 % a second: about 63 % after 3 s
      - wait: 3
      - call: {}
      - expect_response: {status: expected, integration: self}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - wait: 3
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01}
    observe:
      roles: [light_color]  # the group_color case is automated only
      see: 'The light at hue 200° (sky blue), 90 % saturation, paling at 9 % a second, stopped after 3 s near 63 %.'
      watch: 'The stop: it holds, with no drift on toward white and no jump a second later.'
      ask: Did it stop part way pale and hold there, with no drift or jump?

  # One stop halting a brightness and a color move. A Hue bulb's brightness and color temperature stop let the color
  # carry on (docs/plans/2026-10-28-z2m-move-stop.md), so each attribute is held to its own halt. The color move starts
  # 1 s after the brightness one, as a second button would.
  - name: halts_brightness_and_saturation
    roles: [light_color, group_color]
    setup:
      - set: {state: on, brightness_pct: 20, hs_color: [200, 90]}
      - wait: 1.5  # the set's fade is still running when the raise starts
    steps:
      # 10 % a second for 3 s and 2 s: about 50 % brightness and 70 % saturation at the stop
      - call: {action: raise_brightness, sweep_time: 10}
      - wait: 1
      - call: {action: lower_saturation, sweep_time: 10}
      - wait: 2
      - call: {}
      - expect_response: {status: expected, integration: self}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - expect_state: {state: on, hs_color.1: {min: 60, max: 82}}
      - sample: {attribute: brightness, for: 3, expect: steady, min: 38, max: 70, source: device_side}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01}
      - expect_state: {state: on, hs_color.1: {min: 60, max: 82}}
    observe:
      roles: [light_color]  # Hue's halt writes the predicted xy, so whether it jumps is seen, not read
      only: [hue]
      see: 'The light at 20 % brightness, hue 200° (sky blue), 90 % saturation. Brightness rises 10 % a second; from 1 s, saturation pales 10 % a second. Both stop at 3 s, near 50 % brightness and 70 % saturation.'
      watch: 'The stop: brightness and color both hold, with no jump in either and no drift after.'
      ask: Did brightness and color both stop where they were and hold, with no jump or drift?

  - name: halts_brightness_and_hue
    roles: [light_color, group_color]
    only: [zigbee2mqtt, zha]
    setup:
      - set: {state: on, brightness_pct: 20, hs_color: [30, 90]}
      - wait: 1.5  # the set's fade is still running when the raise starts
    steps:
      - mark_hue: {}
      # 5 % a second for 3 s and 18° a second for 2 s: about 35 % brightness and 36° round the hue wheel at the stop
      - call: {action: raise_brightness, sweep_time: 20}
      - wait: 1
      - call: {action: raise_hue, sweep_time: 20}
      - wait: 2
      - call: {}
      - expect_response: {status: expected, integration: self}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - expect_hue_travel: {by: 36, tolerance: 12}
      - sample: {attribute: brightness, for: 3, expect: steady, min: 25, max: 50, source: device_side}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01}
      - expect_hue_travel: {by: 36, tolerance: 12}
