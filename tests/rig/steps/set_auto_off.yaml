# The device's persistent auto-off: after every turn-on, from any source, it turns itself off after the delay. A
# relay sends the same Switch.SetConfig whatever HA shows it as, so switch_plug covers the Switch component's roles;
# the bulb's RGBCCT is Documented, not run. Each write reloads the device's Shelly entry about 60 s later: the engine
# waits that out before the next call or set on the light, and before the case ends. Its restore clears the setting
# again.
action: set_auto_off
rig_seconds: 600
tests:
  # The one regression case: the write, the repeat that sends nothing, the stored delay read back, and the delay
  # firing on a plain turn-on.
  - name: applies_to_any_turn_on
    roles: [switch_plug]
    only: [shelly]
    steps:
      - set: {state: off}
      - call: {duration: 6}
      - expect_response: {status: expected, integration: self}
      - call: {duration: 6}  # waits out the first write's entry reload
      - expect_response: {status: unchanged, detail: already_set}
      - call: {action: get_attributes}
      - expect_response: {attributes: {auto_off.duration: 6}}
      # Plain HA: core's turn_on has no flip-back, so only the device's own setting can turn it off.
      - set: {state: on}
      - wait: duration - tol
      - expect_state: {state: on}
      - expect_state: {state: off, within: 2 * tol}

  # The duration's floor and ceiling, as the adapter clamps them: a SetConfig error here gives the device's real bounds.
  - name: takes_the_bounds
    roles: [switch_plug]
    only: [shelly]
    firmware_fact: true
    steps:
      - set: {state: off}  # and off throughout, so the short delay never fires
      - call: {duration: 0.05}
      - expect_response: {status: expected, integration: self}
      - call: {duration: 604801}
      - expect_response: {status: expected, integration: self, clamped_to: 604800}
      - call: {action: get_attributes}
      - expect_response: {attributes: {auto_off.duration: 604800}}

  # Precedence with turn_on_for, guessed as its timer replacing the persistent delay for that turn-on. With the two
  # delays either way round, the pair tells per-call, persistent and shortest-wins apart.
  - name: turn_on_for_shorter_wins_per_call
    roles: [switch_plug]
    only: [shelly]
    firmware_fact: true
    steps:
      - set: {state: off}
      - call: {duration: 20}
      - expect_response: {status: expected, integration: self}
      - call: {action: turn_on_for, duration: 6}  # waits out the entry reload
      - expect_state: {state: on, within: tol}
      - wait: duration - tol
      - expect_state: {state: on}
      - expect_state: {state: off, within: 2 * tol}

  - name: turn_on_for_longer_wins_per_call
    roles: [switch_plug]
    only: [shelly]
    firmware_fact: true
    steps:
      - set: {state: off}
      - call: {duration: 6}
      - expect_response: {status: expected, integration: self}
      - call: {action: turn_on_for, duration: 20}  # waits out the entry reload
      - expect_state: {state: on, within: tol}
      - wait: 6 + 2 * tol  # past the persistent delay
      - expect_state: {state: on}
      - wait: duration - 6 - 3 * tol
      - expect_state: {state: on}
      - expect_state: {state: off, within: 2 * tol}
