# DeviceSide's config entry, reloaded and disabled: hue_dimmer's release checklist checked both by hand. The entry
# steps reload it under every other run, so the file runs alone, holding HA exclusively; a disabled entry is enabled
# again when the case ends, and by --recover after a crash. get_attributes, a read, stands in for every action. Hue
# alone runs it, on one lamp: the entry's reload and refusal are the same whatever adapter the call reaches, and Hue
# has a call_resolver of its own to rebuild.
action: get_attributes
name: lifecycle
rig_seconds: 15
tests:
  - name: works_after_a_reload
    roles: [light_ct]
    only: [hue]
    steps:
      - entry: reload
      - call: {}
      - expect_response: {}

  # DeviceSide's actions are registered once per HA run, so a disabled entry's are still there: they raise
  # not_loaded (deviceside's docs/action-behavior.md), not HA's action-not-found or an exception.
  - name: refuses_while_disabled
    roles: [light_ct]
    only: [hue]
    steps:
      - entry: disable
      - call: {}
      - expect_error: {key: not_loaded}
      - entry: enable
      - call: {}
      - expect_response: {}
