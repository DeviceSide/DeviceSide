# Saturation: written as a color at the current hue, which the bulb fades in xy (on Hue, the bridge reports the end xy
# at once). HA's hs is derived from the bulb's xy, so it lands near the limit, not on it.
action: raise_saturation
rig_seconds: 100
tests:
  - name: saturation_to_a_limit
    roles: [light_color, group_color]
    setup:
      - set: {state: on, brightness_pct: 70, hs_color: [200, 30]}
    steps:
      - call: {limit: 80, sweep_time: 5}  # 30 % to 80 % takes 2.5 s
      - expect_response: {status: expected, integration: self}
      - wait: 2.5 + tol
      - expect_state: {state: on, hs_color.1: {min: 70, max: 90}}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 2}

  # Saturation is a target with a transition, so the second raise starts from the prediction the stop left: from the
  # halt, not the setup's 20 % (a stale start) or the limit (a stale end).
  - name: saturation_stop_raise
    roles: [light_color, group_color]
    setup:
      - set: {state: on, brightness_pct: 70, hs_color: [200, 20]}
      - wait: 1  # the bulb fades into the color (0.4 s on Z2M); a move started mid-fade starts short of the mark
    steps:
      - call: {sweep_time: 20}  # 5 % a second: about 35 % after 3 s
      - wait: 3
      - call: {action: stop}
      - expect_response: {status: expected}
      - sample: {attribute: hs_color.1, for: 4, expect: steady, min: 25, max: 45, source: deviceside}
      - call: {sweep_time: 20}
      - sample: {attribute: hs_color.1, for: 2, expect: rising, min: 25, max: 60, source: deviceside}
