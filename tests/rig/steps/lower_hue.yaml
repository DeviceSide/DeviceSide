# Hue on Zigbee2MQTT and ZHA: a cycle the bulb runs until a stop, so each test ends with one. Zigbee2MQTT publishes a
# hue stop's color as hs, which HA takes only with z2m_color_modes on (the default).
action: lower_hue
rig_seconds: 75
tests:
  - name: cycles_down_the_wheel
    roles: [light_color, group_color]
    only: [zigbee2mqtt, zha]
    setup:
      # Yellow to orange, as raise_hue's range: in the greens a Hue bulb's own wheel and HA's hue from its xy part
      # by 25° and more.
      - set: {state: on, brightness_pct: 70, hs_color: [90, 90]}
    steps:
      - call: {sweep_time: 20}  # 18° a second: about 36° after 3 s
      - expect_response: {status: expected, integration: self}
      - wait: 3
      - call: {action: stop}
      - expect_matches_read: {attributes: [xy_color.0, xy_color.1], tolerance: 0.01, within: 3}
      - expect_state: {state: on, hs_color.0: {min: 24, max: 48}}
