# On the group role set_attributes writes and confirms every member, so the room's own row reads the same values back.
action: get_attributes
rig_seconds: 300
tests:
  # The setup is DeviceSide's own set_attributes: it writes while the light is off, then reads back every member and
  # raises not_stored when one missed the write, so a dropped delivery fails here and not as a wrong read (#281).
  - name: reads_while_off
    roles: [light_ct]
    steps:
      - set: {state: off}
      - call: {action: set_attributes, brightness: 40, color_temp_kelvin: 2700}
      - expect_response: {status: expected, integration: self}
      - wait: 1  # Hue's set_attributes returns before the bridge's event reaches aiohue's cache, which get_attributes reads
      - call: {}
      - expect_response:
          attributes: {brightness: {min: 39, max: 41}, color_temp_kelvin: {min: 2650, max: 2750}}

  - name: predicts_mid_move  # about 40% three seconds in, not the 100% the bridge reports
    roles: [light_ct, group]
    only: [hue]  # the only integration whose read predicts a fade
    steps:
      - set: {state: on, brightness_pct: 10}
      - call: {action: raise_brightness, sweep_time: 10}
      - wait: 3
      - call: {}
      - expect_response: {attributes: {brightness: {min: 25, max: 55}}}

  # Shelly reports only the active mode's color, and the bulb keeps it while off.
  - name: reads_rgb_while_off
    roles: [light_color]
    only: [shelly]
    steps:
      - set: {state: on, rgb_color: [255, 0, 0]}
      - set: {state: off}
      - call: {}
      - expect_response: {attributes: {rgb_color: [255, 0, 0], hs_color: [0, 100], color_temp_kelvin: null}}

  # Zigbee2MQTT reads the bulb live, and it keeps xy while off. An in-gamut point, so it reads back as set.
  - name: reads_xy_while_off
    roles: [light_color]
    only: [zigbee2mqtt]
    steps:
      - set: {state: on, xy_color: [0.3, 0.5]}
      - wait: 2  # Z2M sends color after on, and a bulb drops it if the off lands first
      - set: {state: off}
      - call: {}
      - expect_response:
          attributes:
            xy_color.0: {min: 0.29, max: 0.31}
            xy_color.1: {min: 0.49, max: 0.51}
            hs_color.0: {min: 94, max: 108}  # xy (0.3, 0.5) is hue 101; the xy bounds above span 96 to 107
            color_temp_kelvin: null

  # Zigbee2MQTT reads each member: a group has a timer only when every member that is on runs one.
  - name: reads_a_group_timer
    roles: [group]
    only: [zigbee2mqtt]
    steps:
      - set: {state: off}
      - call: {action: turn_on_for, duration: 20}
      - call: {}
      - expect_response: {attributes: {timer.turns: "off", timer.remaining_s: {min: 15, max: 20}}}

  # Hue native control sends a hue and saturation as an xy command, so the bulb is put in hs mode with it off.
  - name: keeps_and_reads_hs_while_off
    roles: [light_color]
    only: [zigbee2mqtt]
    steps:
      - z2m_option: {hue_native_control: false}
      - set: {state: on, hs_color: [240, 90]}
      - expect_state: {color_mode: hs, within: 2 * tol}  # without both modes, HA drops it and stays in xy
      - z2m_option: {hue_native_control: true}
      - set: {state: off}
      - call: {}
      - expect_response: {attributes: {hs_color.0: {min: 235, max: 245}, hs_color.1: {min: 85, max: 95}}}

  # ZHA reads the bulb's color live, and the bulb keeps it while off; Hue reads the bridge, which keeps it too and
  # leaves color temperature out in color mode. Lists compare whole, so hs is read by index.
  - name: reads_color_while_off
    roles: [light_color]
    only: [zha, hue]
    steps:
      - set: {state: on, hs_color: [30, 80]}
      - set: {state: off}
      - wait: 2  # the bulb fades while turning off
      - call: {}
      - expect_response:
          attributes: {hs_color.0: {min: 25, max: 35}, hs_color.1: {min: 75, max: 85}, color_temp_kelvin: null}

  # The device's own timer, read back with the time it has left; the row loses it once the timer ends.
  # `"off"` is quoted: YAML reads a bare off as false.
  - name: reads_a_running_timer
    roles: [switch_plug, light_dimmable]
    steps:
      - set: {state: off}
      - wait: 2  # ZHA ignores a light's "on" report for 1.5 s after light.turn_off
        only: [zha]
      - call: {action: turn_on_for, duration: 20}
      - expect_state: {state: on, within: tol}
      - call: {}
      - expect_response: {attributes: {timer.turns: "off", timer.remaining_s: {min: 15, max: 20}}}
      - wait: 5  # the device counts down, rather than echoing the duration
      - call: {}
      - expect_response: {attributes: {timer.remaining_s: {min: 10, max: 16}}}
      - expect_state: {state: off, within: 15 + 2 * tol}
      - call: {}
      - expect_response: {attributes: {timer: null}}

  # A turn_off cancels the timer, so the row must not report one left over on a plug that is off.
  - name: reads_no_timer_after_a_turn_off
    roles: [switch_plug]
    steps:
      - set: {state: off}
      - call: {action: turn_on_for, duration: 20}
      - set: {state: off}
      - call: {}
      - expect_response: {attributes: {timer: null}}

  - name: reads_an_auto_on_timer
    roles: [switch_plug]
    only: [shelly]  # Matter has no OffWithTimedOn
    steps:
      - set: {state: on}
      - call: {action: turn_off_for, duration: 20}
      - call: {}
      - expect_response: {attributes: {timer.turns: "on", timer.remaining_s: {min: 15, max: 20}}}
      - expect_state: {state: on, within: 20 + 2 * tol}
      - call: {}
      - expect_response: {attributes: {timer: null}}
