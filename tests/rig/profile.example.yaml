# A rig profile: one test setup on the Home Assistant that .env.rig connects to (its address, tokens and deploy
# commands stay there). Copy this file to tests/rig/profiles/<name>.yaml (gitignored), one per setup, and fill in
# the setup's own entities. scripts/rig.py --profile <name> picks one; it can be left out while there is only one.
# The name goes into every test record, which is public: name it for the setup (lab, house), never a person or place.
#
# pause: the automations and switches turned off while the rig runs, for whatever would fight the tests on these
# entities (motion lighting, an Adaptive Lighting switch). Only those that were on are turned back on, once no run
# still needs them off. A list is paused by every run; a mapping pauses its `all` list for every run and each
# integration key's list for a run on that integration.
#
# Then one list per integration key (shelly, zigbee2mqtt, zha, matter, hue). Roles pick which test uses an entity:
#   switch_plug, light_onoff (a relay shown as a light), light_wrapped (a switch_as_x light over a switch),
#   light_dimmable, light_ct, light_color, group, group_color (a native group whose members all take color), scene
# Tests restore each entity's prior state afterwards, but every entity here will visibly change state.
# powered_by names the profile's switch an entity draws power through: its cases need that switch on, and a case
# that switches it puts the entity back once power returns.
# members lists a group's (or group_color's) lights, for a group light with no entity_id attribute (a Z2M group).
#
# roam: bulbs the run moves from their home round the networks it declares, of Hue -> ZHA -> Z2M, and home again
# (docs/contributing/testing.md, Roaming). networks lists where they may go, home included; a run locks only those
# it visits, and on any other network their roles find no entity, so those cases skip. Each bulb's home is hue, the
# only home supported so far. A roaming bulb is listed here only, never under an integration: each network's suites
# use it while it is there. Its groups are native groups of those bulbs the run makes on each network
# (ds-rig-<object ID>, renamed to entity_id) and removes.

pause:
  all: [automation.study_motion]
  hue: [switch.adaptive_lighting_study]

shelly:
  - entity_id: switch.office_plug
    roles: [switch_plug]
  - entity_id: light.hall_relay
    roles: [light_onoff]
  - entity_id: light.porch_lamp
    roles: [light_wrapped]

hue:
  - entity_id: light.desk_lamp
    roles: [light_ct]
  - entity_id: light.living_room  # a room or zone; scene steps also point at it
    roles: [group]
  - entity_id: scene.living_room_relax  # a scene in that room
    roles: [scene]

zigbee2mqtt:
  - entity_id: light.bulb_a  # also the single bulb
    roles: [light_dimmable, light_ct]
  - entity_id: light.bulb_group  # a Z2M group of bulb_a and bulb_b
    roles: [group]
    members: [light.bulb_a, light.bulb_b]
  - entity_id: light.color_group  # a Z2M group of color bulbs only
    roles: [group_color]
    members: [light.bulb_c]

roam:
  networks: [hue, zha, zigbee2mqtt]
  bulbs:
    - ieee: "0x0017880100000001"  # the bulb's IEEE address, in any spelling
      entity_id: light.lab_color  # renamed to this after every join
      home: hue
      roles: [light_dimmable, light_ct, light_color]
      z2m_options: {hue_native_control: true}  # set again after each Z2M join: Z2M's remove drops them
  # groups: in place of fixed Hue, ZHA and Z2M groups and a Hue scene, as in the lab profile; a role here can't
  # also be on a fixed entity of those networks.
  # groups:
  #   - entity_id: light.lab_bulbs  # a Z2M group, a ZHA group or a Hue zone, on each visit
  #     roles: [group]
  #     members: all  # or a list of roam bulbs' entity IDs
  #     scene: scene.lab_bulbs_relax  # optional: a Hue scene in the zone, for the scene role
  #   - entity_id: light.lab_color_bulbs
  #     roles: [group_color]  # its members must all have light_color
  #     members: [light.lab_color]
